name: linux

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install clang and lld
        run: sudo apt-get update && sudo apt-get install -y clang lld make
      - name: Build
        run: make -j"$(nproc)"
      - name: Self test
        run: make test
